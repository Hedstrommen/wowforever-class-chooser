<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Forever — What Should You Play?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stone-frame">
    <header class="banner">
      <h1 class="game-title">WoW Forever</h1>
      <p class="subtitle">What Should You Play?</p>
      <nav class="nav-links" data-nav="quiz.html"></nav>
    </header>

    <main>
      <div class="quiz-top-row">
        <a class="btn btn-home" href="index.html">← Back to Home</a>
      </div>

      <section id="quizContainer" class="quiz-container parchment">
        <div id="progressWrap">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <p id="progressText"></p>
        </div>
        <div id="questionBox"></div>
      </section>

      <section id="resultContainer" class="result-container parchment hidden">
        <h2 class="section-heading">Your Destiny Awaits</h2>
        <div id="resultBox"></div>
        <div class="result-actions">
          <button class="btn" id="restartBtn">Take the Quiz Again</button>
          <a class="btn btn-home" href="index.html">← Back to Home</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>WoW Forever — a fan-made tool. Not affiliated with Blizzard Entertainment.</p>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
